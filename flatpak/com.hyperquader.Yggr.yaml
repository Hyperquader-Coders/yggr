# Flatpak manifest for the yggr editor, with bundled language servers.
# Build:   flatpak-builder --user --install --force-clean build-dir flatpak/com.hyperquader.Yggr.yaml
# Run:     flatpak run com.hyperquader.Yggr <file>
# See docs/FLATPAK.md for the packaging spec and verification steps.
#
# yggr imports no Odin collection: its JSON reader is amber-json's, vendored under
# third_party/amber-json, and its LSP framing is adapted from OLS under src/lsp/vendor_ols,
# both inside the source copied below. The system libraries it links (GTK 4,
# GtkSourceView 5, GLib, GObject and GIO) all come from the GNOME runtime, so no module
# builds them.

app-id: com.hyperquader.Yggr
# stable, not flatpak-builder's default master: the branch is what users pin,
# renaming it later orphans every install, and Flathub expects stable.
branch: stable
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  # The Odin toolchain, mounted at /usr/lib/sdk/odin during the build. Published
  # from flatpak.amberlinux.org, so the CI workflow adds that remote before
  # building. The extension exists so no Odin application has to compile the
  # compiler in its own manifest.
  - org.freedesktop.Sdk.Extension.odin
  # Odin links through clang, which the freedesktop SDK does not ship. Without
  # it every Odin module below fails at the link step with "clang: command not
  # found".
  - org.freedesktop.Sdk.Extension.llvm22

command: yggr

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # A code editor works on projects, not single files: OLS reads every file of a
  # package and its imports, `odin check` builds them, and the file tree, terminal
  # and go-to-definition follow real paths anywhere on the machine. The document
  # portal hands over one chosen file under a /run/user/.../doc path, which none of
  # those can use, and home alone misses projects on other disks. Flathub's linter
  # reports finish-args-host-filesystem-access; the submission asks for its
  # exception on these grounds, as GNOME Builder, VS Code and Zed have.
  - --filesystem=host
  # OLS type-checks by shelling out to `odin check`; point it at the bundled
  # toolchain (kept by the cleanup block below) so `core:`/`base:` imports
  # resolve and diagnostics work with no host Odin installed.
  - --env=ODIN_ROOT=/app/opt/odin
  # Use GTK's built-in simple input method instead of the flatpak's IBus IM
  # module. The runtime's newer GTK4 calls an IBus D-Bus method the host's
  # older ibus-daemon lacks ("No such property PostProcessKeyEvent"), which
  # spams warnings on key events and crashes when the text context menu opens.
  # Simple IM keeps dead keys, compose (de/en) and the emoji picker; it drops
  # only full IBus/CJK IME. Revisit if CJK input is needed (grant IBus access
  # and match versions).
  - --env=GTK_IM_MODULE=gtk-im-context-simple
  # Uncomment if bundled/managed LSP servers need network (e.g. gopls
  # fetching modules). OLS and marksman work fully offline.
  # - --share=network

# A released flatpak carries no debug information: no .Debug extension is made,
# and each module strips the binaries it installs by name. The build option
# strip is not used because it walks all of /app, and Odin's vendor tree holds
# other architectures' libraries, which strip cannot read.
build-options:
  no-debuginfo: true
  append-path: /usr/lib/sdk/llvm22/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm22/lib

cleanup:
  - /include
  - /lib/pkgconfig
  # Keep the whole Odin toolchain at /opt/odin (compiler, core, base and
  # vendor) so it runs at runtime (OLS `odin check` for diagnostics, and a
  # batteries-included Odin environment for newcomers). Odin validates that
  # ODIN_ROOT has the `vendor` collection, so vendor must stay; only strip the
  # cross-platform dead weight (Windows/macOS/static binaries) to save space.
  - '*.a'
  - '*.dll'
  - '*.lib'
  - '*.dylib'

modules:
  # --------------------------------------------------------------------
  # NOTE: org.gnome.Platform ships gtksourceview-5; only add a source module
  # for it if a newer version than the runtime provides is needed (check:
  # flatpak run --command=pkg-config org.gnome.Sdk//51 --modversion
  # gtksourceview-5).
  # --------------------------------------------------------------------

  # ---- Odin toolchain, copied from the SDK extension into the app ------
  # The extension is a BUILD-time mount at /usr/lib/sdk/odin and is absent at
  # runtime, but OLS produces diagnostics by shelling out to `odin check`, so a
  # runnable compiler plus core/base/vendor has to live inside the app. Hence a
  # copy rather than a symlink.
  #
  # The extension ships the libLLVM the compiler is linked against, in the same
  # directory, so copying the directory brings it along, which is why this
  # module has no libLLVM handling of its own.
  - name: odin-toolchain
    buildsystem: simple
    build-commands:
      - mkdir -p /app/opt/odin
      - cp -a /usr/lib/sdk/odin/. /app/opt/odin/
      # enable.sh sets paths for a build environment that does not exist at
      # runtime; the app sets ODIN_ROOT itself in finish-args.
      - rm -f /app/opt/odin/enable.sh
      # The extension's licence texts (Odin's zlib, the MIT of the utf8proc code
      # compiled into the compiler, LLVM's Apache-2.0 WITH LLVM-exception) go to
      # /app/share/licenses/<component>/, the app's place for them; the rest of
      # its share/ is the extension's own AppStream component, which describes
      # the extension, not this app. An extension too old to carry the texts
      # stops the build here.
      - test -d /app/opt/odin/share/licenses || { echo "org.freedesktop.Sdk.Extension.odin
        ships no share/licenses; install an extension that does"; exit 1; }
      - mkdir -p /app/share/licenses
      - mv /app/opt/odin/share/licenses/* /app/share/licenses/
      - rm -r /app/opt/odin/share
      # Stripped here whatever the SDK extension's build left in them; libLLVM
      # keeps the dynamic symbols the compiler links against.
      - strip /app/opt/odin/odin
      - strip --strip-unneeded /app/opt/odin/libLLVM.so.22.1
      - ls -l /app/opt/odin/odin /app/opt/odin/libLLVM*
      # Prove the copy runs where it lives in the app, before anything is
      # built with it. A toolchain that only works at its build-time path is a
      # runtime failure on a user's machine.
      - ODIN_ROOT=/app/opt/odin /app/opt/odin/odin version

  # ---- OLS: Odin language server (built from source, MIT) --------------
  - name: ols
    buildsystem: simple
    build-options:
      # Build with the toolchain the module above copied in, not a host one.
      append-path: /app/opt/odin
      env:
        ODIN_ROOT: /app/opt/odin
    build-commands:
      # Upstream's build.sh is not used: it stamps VERSION from `git rev-parse`
      # plus today's date (neither reproducible), and it passes
      # -microarch:native, which targets the CPU that happens to be building.
      # A bundle is redistributed, so it must run on the user's machine, not the
      # builder's: native can emit instructions their CPU lacks. The rest of
      # the flags are upstream's release line.
      - odin build src/ -collection:src=src -out:ols -no-bounds-check -o:speed
        -define:VERSION=dev-2026-10
      - odin build tools/odinfmt/main.odin -file -collection:src=src -out:odinfmt
        -no-bounds-check -o:speed
      - install -Dm755 ols /app/bin/ols
      - install -Dm755 odinfmt /app/bin/odinfmt
      - strip /app/bin/ols /app/bin/odinfmt
      # MIT: the binaries are redistributed, so the notice goes with them.
      - install -Dm644 LICENSE /app/share/licenses/ols/LICENSE
      # OLS resolves its `builtin` docs folder next to its own binary
      # (it logs "Failed to find the builtin folder at /app/bin/builtin"
      # otherwise, and then can't analyse or emit diagnostics).
      - cp -r builtin /app/bin/builtin
    sources:
      # The ols commit must track the compiler the SDK extension ships: ols
      # dev-2026-05 references Odin_OS_Type.Haiku, which the dev-2026-07a
      # compiler does not have, so it does not compile against it ("Undeclared
      # name 'Haiku'"). Building ols from source is what surfaces this; a
      # prebuilt binary hides the skew, because it is compiled against whatever
      # ols CI uses.
      #
      # dev-2026-06 is the newest tagged ols release; ols dev-2026-06 and
      # dev-2026-08 fail against the Odin dev-2026-10 compiler with
      # "Inline_Asm_Expr" (a node the compiler's AST has and they lack). No ols
      # tag matches dev-2026-10, so this pins the same untagged commit on ols
      # master that amber-odin's own OLS_COMMIT follows for dev-2026-10: the
      # newest commit that builds with that compiler. The commit alone, with no
      # branch: flatpak-builder refuses a commit that is not the branch's head,
      # and master moves on.
      - type: git
        url: https://github.com/DanielGavin/ols.git
        commit: ec8606b97788d415d8b5ffa83782c7be52c6b14a

  # ---- marksman: Markdown language server (prebuilt release, MIT) ------
  - name: marksman
    buildsystem: simple
    build-commands:
      - install -Dm755 marksman-linux-x64 /app/bin/marksman
      # MIT: the binary is redistributed, so the notice goes with it.
      - install -Dm644 LICENSE /app/share/licenses/marksman/LICENSE
    sources:
      - type: file
        url: https://github.com/artempyanykh/marksman/releases/download/2026-02-08/marksman-linux-x64
        sha256: be5098e8213219269c47fc0d916a66fa31ce0602ec967475c722260aabf26087
      # The licence at the same release tag.
      - type: file
        url: https://raw.githubusercontent.com/artempyanykh/marksman/2026-02-08/LICENSE
        sha256: f48413df41ebe5a5f77f997f1f8a0cf5236f24c6878a16e0073da81642aabf04

  # ---- Optional extra servers (uncomment as wanted) ---------------------
  # gopls is best built from source with the golang SDK extension
  # (org.freedesktop.Sdk.Extension.golang) rather than a prebuilt blob;
  # add `--share=network` above if Go module features are used.
  # - name: gopls
  #   buildsystem: simple
  #   build-options:
  #     append-path: /usr/lib/sdk/golang/bin
  #     env: { GOFLAGS: -mod=mod }
  #   build-commands:
  #     - . /usr/lib/sdk/golang/enable.sh && GOBIN=/app/bin go install golang.org/x/tools/gopls@latest

  # ---- yggr itself ------------------------------------------------------
  - name: yggr
    buildsystem: simple
    build-options:
      env:
        ODIN_ROOT: /app/opt/odin
    build-commands:
      # C shim for GObject provider interfaces (ARCHITECTURE §6)
      - mkdir -p build
      - gcc -c src/ui/shim.c -o build/shim.o $(pkg-config --cflags gtk4 gtksourceview-5)
      # -source-code-locations:filename as in the Makefile's build target: no
      # build-tree paths in the binary.
      - /app/opt/odin/odin build src -source-code-locations:filename
        -out:build/yggr -extra-linker-flags:"build/shim.o $(pkg-config --libs gtk4 gtksourceview-5)"
      - install -Dm755 build/yggr /app/bin/yggr
      - strip /app/bin/yggr
      # Expose `odin` on PATH for OLS (`odin check`) and for users. The libLLVM
      # it needs is in the toolchain copy above, from the SDK extension.
      - ln -sf ../opt/odin/odin /app/bin/odin
      # Bundled data
      - install -Dm644 data/language-specs/odin.lang /app/share/gtksourceview-5/language-specs/odin.lang
      - install -Dm644 flatpak/lsp-servers.conf /app/share/yggr/lsp-servers.conf
      - install -Dm644 data/com.hyperquader.Yggr.desktop /app/share/applications/com.hyperquader.Yggr.desktop
      - install -Dm644 data/com.hyperquader.Yggr.metainfo.xml /app/share/metainfo/com.hyperquader.Yggr.metainfo.xml
      # The licences of what is compiled into /app/bin/yggr: yggr's own; and the
      # vendored amber-json, with Odin's core:encoding/json (zlib) it derives
      # from. OLS (MIT), which src/lsp/vendor_ols adapts, has its text in
      # /app/share/licenses/ols from the module above. THIRD_PARTY.md says which
      # code is whose.
      - install -Dm644 LICENSE /app/share/licenses/yggr/LICENSE
      - install -Dm644 THIRD_PARTY.md /app/share/licenses/yggr/THIRD_PARTY.md
      - install -Dm644 third_party/amber-json/LICENSE /app/share/licenses/yggr/amber-json-LICENSE
      - install -Dm644 third_party/amber-json/third_party/odin/LICENSE
        /app/share/licenses/yggr/odin-core-json-LICENSE
      # Localization catalogs (gettext): English source + German out of the box.
      # Compiled here rather than installed from the tree. The .mo is a build
      # artefact and is gitignored, so `type: dir` finds it only on a machine
      # where `make mo` has run; it is absent from a clean checkout, which is
      # what CI and Flathub build from. Same command as the Makefile's `mo`.
      - msgfmt --check po/de.po -o build/yggr-de.mo
      - install -Dm644 build/yggr-de.mo /app/share/locale/de/LC_MESSAGES/yggr.mo
      # Icons: scalable SVG, symbolic and pre-rendered hicolor PNGs (shipped in
      # the repo). The .desktop Icon= key resolves to these by app-id.
      - install -Dm644 data/icons/hicolor/scalable/apps/com.hyperquader.Yggr.svg
        /app/share/icons/hicolor/scalable/apps/com.hyperquader.Yggr.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/com.hyperquader.Yggr-symbolic.svg
        /app/share/icons/hicolor/symbolic/apps/com.hyperquader.Yggr-symbolic.svg
      - for s in 32 48 64 128 256 512; do
        install -Dm644 data/icons/hicolor/${s}x${s}/apps/com.hyperquader.Yggr.png
        /app/share/icons/hicolor/${s}x${s}/apps/com.hyperquader.Yggr.png; done
    sources:
      - type: dir
        path: ..
