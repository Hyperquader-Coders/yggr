# lsp-servers.conf — bundled language-server registry for yggr.
# Installed to /app/share/yggr/lsp-servers.conf inside the flatpak.
#
# Format:  <gtksourceview-language-id>=<command line>
# Resolution order implemented in resolve_server_argv (see FLATPAK.md §3):
#   1. $YGGR_LSP_CMD               (explicit override, testing)
#   2. this file                     (bundled servers, flatpak case)
#   3. `foundry lsp run <id>`        (host case, foundry on PATH)
# A missing entry at every level is a soft failure (SPEC §5).

odin=ols
markdown=marksman

# Uncomment when the corresponding module ships in the manifest:
# go=gopls
# c=clangd
# cpp=clangd
# rust=rust-analyzer
