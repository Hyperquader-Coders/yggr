<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <title>Yggr</title>
  <metadata>Yggr application icon — a neon Yggdrasil (world-tree) forming a "Y", framed by code brackets on a dark rounded tile. Author: Andre Bremer &lt;hyperquader@gmail.com&gt; (https://hyperquader.com). License: GPL-3.0-or-later (same as the project); see LICENSE.</metadata>
  <defs>
    <!-- Dark Mode Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Neon Tech Gradient -->
    <linearGradient id="yggrGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#60EFFF" />
    </linearGradient>

    <!-- Glow/Bloom Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)" />

  <!-- Outer Ring (Digital Horizon) -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="url(#yggrGrad)" stroke-width="3" stroke-dasharray="8 12" opacity="0.25" />

  <!-- Code Brackets Framing the Tree -->
  <g opacity="0.85">
    <path d="M 140 170 L 90 250 L 140 330" fill="none" stroke="url(#yggrGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 360 170 L 410 250 L 360 330" fill="none" stroke="url(#yggrGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- The Yggr Tree (Stylized Y & Yggdrasil System) -->
  <g filter="url(#glow)">
    <path d="M 250 370 L 250 260 L 180 190 L 180 140 M 250 260 L 320 190 L 320 140"
          fill="none" stroke="url(#yggrGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 250 295 L 210 255 M 250 295 L 290 255"
          fill="none" stroke="url(#yggrGrad)" stroke-width="8" stroke-linecap="round" />
    <line x1="250" y1="260" x2="250" y2="155" stroke="url(#yggrGrad)" stroke-width="10" stroke-linecap="round" />
    <circle cx="180" cy="140" r="10" fill="#FFFFFF" />
    <circle cx="320" cy="140" r="10" fill="#FFFFFF" />
    <circle cx="250" cy="155" r="10" fill="#FFFFFF" />
    <circle cx="210" cy="255" r="7" fill="#60EFFF" />
    <circle cx="290" cy="255" r="7" fill="#60EFFF" />
  </g>
</svg>
